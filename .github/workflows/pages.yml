name: Deploy teaching resources to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - run: node scripts/check-splitplot.mjs
      - run: node scripts/check-maize.mjs
      - run: node scripts/check-nitrogen.mjs
      - run: node scripts/check-minimum.mjs
      - run: node scripts/check-cultures.mjs
      - run: node scripts/check-hydro-lab.mjs
      - run: node scripts/check-error.mjs
      - run: node scripts/check-normal.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
