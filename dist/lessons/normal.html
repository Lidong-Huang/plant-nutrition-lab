<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="拖动旋转正态分布曲线，通过形状、对称、均值、标准差、拐点与概率六个步骤理解分布。"><title>正态分布 · 旋转探索</title><link rel="stylesheet" href="../assets/normal-scene.css"><link rel="icon" href="data:,"></head>
<body><header class="top"><a href="../index.html" class="home" aria-label="返回课程目录">⌂ <span>目录</span></a><h1>正态分布</h1><span class="identity">黄利东 · 互动教学</span><div class="tools"><button id="front" title="恢复正面视角">正视</button><button id="reset" title="恢复初始参数与视角">复位</button><button id="fullscreen" title="全屏演示">全屏 ↗</button></div></header>
<nav id="steps" class="steps" aria-label="学习步骤"><button data-step="0"><span>01</span> 形状</button><button data-step="1"><span>02</span> 对称</button><button data-step="2"><span>03</span> 均值</button><button data-step="3"><span>04</span> 标准差</button><button data-step="4"><span>05</span> 拐点</button><button data-step="5"><span>06</span> 概率</button></nav>
<main id="stage" class="stage"><canvas id="scene" tabindex="0" role="img" aria-label="正态分布曲线。拖动旋转，滚轮缩放；聚焦后方向键旋转，加减键缩放。"></canvas><div class="stage-corner" aria-hidden="true"><span class="dot"></span><span id="stage-keyword">钟形 · 连续</span></div><div class="probability-modes" id="probability-modes" hidden aria-label="概率面积"><button data-area="total">总面积</button><button data-area="one">±1σ</button><button data-area="ninetyfive" class="active">中央 95%</button></div><div class="view-hint">拖动旋转 <span>·</span> 滚轮缩放</div><button class="view-toggle" id="tilt" title="切换正面与立体视角" aria-label="切换正面与立体视角">◇</button></main>
<footer class="bottom"><button id="prev" class="navbutton" aria-label="上一步">←</button><div class="controls"><label for="mu">μ <output id="mu-value">200</output><input id="mu" aria-label="均值 μ" type="range" min="160" max="240" step="1" value="200"></label><span class="separator"></span><label for="sigma">σ <output id="sigma-value">20</output><input id="sigma" aria-label="标准差 σ" type="range" min="10" max="35" step="1" value="20"></label></div><div class="playback"><button id="play" aria-label="自动演示">▶</button><span id="progress">1 / 6</span></div><button id="next" class="navbutton next" aria-label="下一步">→</button></footer><div class="screenreader" id="description" aria-live="polite"></div><script src="../assets/math.js"></script><script src="../assets/normal.js"></script></body></html>
