function updateLabels(){ $('mu').value=state.mu;$('sigma').value=state.sigma;$('mu-value').textContent=number(state.mu,0);$('sigma-value').textContent=number(state.sigma,0);$('stage-keyword').textContent=keywords[state.step];$('progress').textContent=`${state.step+1} / 9`;$('prev').disabled=state.step===0;$('next').disabled=state.step===8;$('probability-modes').hidden=state.step!==5;document.body.dataset.normalStep=state.step;extension?.update();document.querySelectorAll('#steps button').forEach(b=>{let active=+b.dataset.step===state.step;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'step':'false')});document.querySelectorAll('[data-area]').forEach(b=>{let active=b.dataset.area===state.area;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});let description=descriptions[state.step];if(state.step===5&&state.area==='total')description='正态曲线下总面积为1。';if(state.step===5&&state.area==='one')description='均值加减一个标准差之间的概率约为68.27%，两侧尾部合计约31.73%。';if($('description').textContent!==description)$('description').textContent=description;const alt=`${description}当前均值${number(state.mu,0)}，标准差${number(state.sigma,0)}。可拖动旋转。`;if(canvas.getAttribute('aria-label')!==alt)canvas.setAttribute('aria-label',alt);needDraw=true}

function step(n,manual=true){if(manual)stop();state.step=clamp(n,0,8);if(state.step>=6){state.yaw=0;state.pitch=0;state.zoom=1}extension?.enter(state.step,!manual);stepStart=performance.now();autoStart=stepStart;updateLabels();document.querySelector('#steps button.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function frame(now){const dt=Math.min(now-last,100);last=now;let moving=extension?.tick(dt)||false;if(state.playing){let t=(now-autoStart)/1000;if(state.step===2)state.mu=Math.round(200+34*Math.sin(t*Math.PI/3));if(state.step===3)state.sigma=Math.round(22.5+12.5*Math.sin(t*Math.PI/3));if(state.step===7)state.z=-2.5+5*Math.min(1,t/7);if(now-autoStart>8000){if(state.step===8)stop();else{if(state.step===2)state.mu=200;if(state.step===3)state.sigma=20;step(state.step+1,false)}}updateLabels();moving=true}const k=1-Math.exp(-dt/110);for(const key of['mu','sigma','yaw','pitch','zoom']){const diff=state[key]-current[key];if(Math.abs(diff)>.0001){current[key]+=diff*k;moving=true}else current[key]=state[key]}if(needDraw||moving){needDraw=false;draw(now)}requestAnimationFrame(frame)}
function front(){stop();state.yaw=0;state.pitch=0;state.zoom=1;needDraw=true}
function reset(){stop();Object.assign(state,{mu:200,sigma:20,yaw:state.step>=6?0:-.26,pitch:state.step>=6?0:.18,zoom:1,area:'ninetyfive',z:1});extension?.reset();updateLabels()}
extension=NormalExtension.create({canvas,ctx,state,manual:()=>{stop();needDraw=true},invalidate:()=>needDraw=true});
$('z-bound').oninput=e=>{stop();state.z=Number(e.target.value);updateLabels()};
window.normalDiagnostics={get state(){return {...state}},get current(){return {...current}},get extension(){return extension.diagnostics}};
document.querySelectorAll('#steps button').forEach(b=>b.onclick=()=>step(+b.dataset.step));$('prev').onclick=()=>step(state.step-1);$('next').onclick=()=>step(state.step+1);
for(const key of['mu','sigma'])$(key).addEventListener('input',e=>{stop();state[key]=Number(e.target.value);updateLabels()});document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{stop();state.area=b.dataset.area;updateLabels()});$('front').onclick=front;$('reset').onclick=reset;$('tilt').onclick=()=>{stop();if(Math.abs(state.yaw)+Math.abs(state.pitch)<.02){state.yaw=-.4;state.pitch=.3;needDraw=true}else front()};$('play').onclick=()=>{if(state.playing){stop();return}if(state.step===8)step(0);state.playing=true;extension.enter(state.step,true);autoStart=performance.now();$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','暂停演示')};
canvas.addEventListener('pointerdown',e=>{stop();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('dragging');baseDrag={x:e.clientX,y:e.clientY,yaw:state.yaw,pitch:state.pitch,zoom:state.zoom,distance:pointers.size===2?distance():0}});
function distance(){const a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const d=distance();if(baseDrag.distance>0)state.zoom=clamp(baseDrag.zoom*d/baseDrag.distance,.65,1.75);else{baseDrag.distance=d;baseDrag.zoom=state.zoom}}else if(baseDrag){let dx=e.clientX-baseDrag.x,dy=e.clientY-baseDrag.y;state.yaw=clamp(baseDrag.yaw+dx*.006,-1.05,1.05);state.pitch=clamp(baseDrag.pitch+dy*.005,-.42,.65)}needDraw=true;e.preventDefault()});
function release(e){pointers.delete(e.pointerId);if(pointers.size===0){canvas.classList.remove('dragging');baseDrag=null}else{const a=[...pointers.values()][0];baseDrag={...a,yaw:state.yaw,pitch:state.pitch,zoom:state.zoom,distance:0}}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('wheel',e=>{e.preventDefault();stop();state.zoom=clamp(state.zoom*Math.exp(-e.deltaY*.001),.65,1.75);needDraw=true},{passive:false});canvas.addEventListener('dblclick',front);
canvas.addEventListener('keydown',e=>{let handled=true;stop();if(e.key==='ArrowLeft')state.yaw=clamp(state.yaw-.12,-1.05,1.05);else if(e.key==='ArrowRight')state.yaw=clamp(state.yaw+.12,-1.05,1.05);else if(e.key==='ArrowUp')state.pitch=clamp(state.pitch-.1,-.42,.65);else if(e.key==='ArrowDown')state.pitch=clamp(state.pitch+.1,-.42,.65);else if(e.key==='+'||e.key==='=')state.zoom=clamp(state.zoom+.1,.65,1.75);else if(e.key==='-')state.zoom=clamp(state.zoom-.1,.65,1.75);else if(e.key==='0')front();else handled=false;if(handled){e.preventDefault();needDraw=true}});
document.addEventListener('keydown',e=>{if(e.target===canvas||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){e.preventDefault();step(state.step+1)}else if(e.key==='ArrowLeft'){e.preventDefault();step(state.step-1)}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='F11 全屏'}};document.addEventListener('fullscreenchange',()=>$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏 ↗');resize();updateLabels();requestAnimationFrame(frame);
})();
</script></body></html>
