function agriculture(){w.ground(6,4);for(let i=0;i<3;i++)for(let j=0;j<2;j++){const x=-3.7+i*.9,z=.1+j*.9;w.box(x,-.03,z,.75,.12,.75,'#b0ad81');MaizeShoot.draw(w,{x,y:.1,z,height:2.3,stage:'vegetative',detail:'high',seed:i+j*5})}w.label([-2.8,3.1,0],'玉米磷肥试验',{size:16,pill:true});w.leaf([-1.3,1.1,0],[-.6,2.15,0],.2,'#74a05e');w.label([-1,2.65,0],'叶片取样',{size:12,pill:true});w.arrow([-.5,1.4,0],[1.1,1.4,0],'#91a783');bench(3,.4,0,3.5);instrument(3,.58,0,.9);sampleBottle(1.6,.58,-.1,.8);w.label([3,3.25,0],'同一份消解液 · 重复测定',{size:15,pill:true});w.label([3,-.4,-.8],`本次观测 x = ${current().value.toFixed(2)}`,{size:14,pill:true});w.label([0,4.3,0],'从田间问题，走到一次测量',{size:19,pill:true})}
function numberLine({decompose=false,y=1.35}={}){const scale=.45,min=Math.min(40,...data.map(p=>p.value))-1,max=Math.max(60,...data.map(p=>p.value))+1,k=Math.min(scale,10/(max-min)),center=(min+max)/2,toX=v=>(v-center)*k,v=current(),mu=toX(MU),xx=toX(v.value),bb=toX(MU+s.bias);w.line([[-5.6,y,0],[5.6,y,0]],'#9aad9a',1.5);for(let n=Math.ceil(min/5)*5;n<max;n+=5){const x=toX(n);w.line([[x,y-.08,0],[x,y+.08,0]],'#819889',1);w.label([x,y-.35,0],String(n),{size:11})}w.line([[mu,y,0],[mu,y+2.75,0]],'#367b67',2);w.label([mu,y+3.02,0],'真值 μ = 50',{size:13,pill:true});w.line([[xx,y,0],[xx,y+1.7,0]],'#588c9e',1.5);disk(xx,y+.85,-.02,.095,'#457c88',10);w.label([xx,y+2.05,0],`观测 x = ${v.value.toFixed(2)}`,{size:13,pill:true});w.line([[mu,y+.6,-.04],[xx,y+.6,-.04]],'#b28a4b',3);w.label([(mu+xx)/2,y+.23,-.05],`误差 e = ${fmt(v.error)}`,{size:13,pill:true,color:'#956f31'});if(decompose){w.line([[bb,y,0],[bb,y+2.6,0]],'#c49b53',1.2,{dash:[4,4]});w.line([[mu,y+2.5,0],[bb,y+2.5,0]],'#c49b53',2.5);w.label([(mu+bb)/2,y+2.8,0],`b=${fmt(s.bias)}`,{size:12,pill:true});w.line([[bb,y+1.45,0],[xx,y+1.45,0]],'#648da9',2.5);w.label([(bb+xx)/2,y+1.1,0],`ε=${fmt(v.epsilon)}`,{size:12,pill:true})}w.label([0,y-.9,0],'观测值 / mg P·L⁻¹',{size:12,pill:true})}
function bridge(){instrument(-3.7,1.75,0,.75);sampleBottle(-5,1.75,0,.7);w.label([-3.7,4.6,0],'同一样品 · 一次测量',{size:16,pill:true});w.label([-3.7,.8,0],`x − μ = ${fmt(current().error)}`,{size:14,pill:true});w.arrow([-1.9,2.6,0],[-.65,2.6,0],'#899e80');target({x:2.45,y:3.05,r:1.75,label:'同一靶心 · 一次射击'});w.label([2.45,.1,0],s.shots?`第 ${s.selected+1} 次 · x=${current().value.toFixed(2)} · e=${fmt(current().error)}`:'等待第 1 发 · 落点会留下编号弹孔',{size:12,pill:true});w.label([0,5.8,0],'真实测量中的偏差，用打靶的位置来观察',{size:17,pill:true})}
function categories(){target({x:0,y:3.4,r:2,label:''});const p=current();w.label([0,6.2,0],`第 ${s.shots?s.selected+1:'—'} 次：x = 50 + ${s.bias.toFixed(1)} + (${p.epsilon.toFixed(2)})`,{size:16,pill:true});w.label([0,.35,0],`误差 ${fmt(p.error)} = 系统偏差 ${fmt(s.bias)} + 随机误差 ${fmt(p.epsilon)}`,{size:13,pill:true})}
function comparisons(){[['中心近 · 散布小',-3.15,5.25,0,.35],['中心偏 · 散布小',3.15,5.25,6,.35],['中心近 · 散布大',-3.15,1.6,0,1.8],['中心偏 · 散布大',3.15,1.6,6,1.8]].forEach(([label,x,y,bias,sigma])=>target({x,y,r:1.4,bias,sigma,seed:73,label,count:24,comparison:true}))}
function translated(){const a=dataset(),coords=M.coordinates(a,MU),range=Math.max(6,Math.abs(s.bias)+4*s.sigma,...coords.error.map(Math.abs)),bins=Math.max(30,Math.min(180,Math.ceil(range*6/s.sigma))),h=M.histogram(coords.error,-range,range,bins),peak=Math.max(...h.map(p=>p.density)),t=s.translation,scale=5/range;function bars(y,color,alpha=1){for(const b of h)if(b.count)w.box(b.x*scale,y,-.1,9.3/bins,b.density/peak*1.4,.35,color,{alpha,lit:false});w.line([[-5.2,y,0],[5.2,y,0]],'#91a893',1.3);return y}const top=3.9,bottom=.55;bars(top,'#9dbeb1',.28);bars(bottom,'#cfb37d',.25);bars(top+(bottom-top)*t,t<.5?'#86b4a4':'#c5a066',.9);for(let j=-2;j<=2;j++){const err=j*range/2,x=j*2.5;w.label([x,top-.28,0],(MU+err).toFixed(1),{size:11});w.label([x,bottom-.28,0],err.toFixed(1),{size:11})}w.line([[0,bottom-.03,-.35],[0,5.45,-.35]],'#5f917e',1,{dash:[4,4]});w.label([0,5.85,0],'观测值 X · 同一批 800 次读数',{size:16,pill:true});w.label([0,2.8,0],'逐个减去真值 μ=50　↓',{size:14,pill:true,color:'#9d793e'});w.label([0,-.3,0],'总误差 e = X−50 · 横轴单位相同',{size:13,pill:true});w.label([0,6.45,0],'轮廓与宽度不变，横轴由“50附近”换到“0附近”',{size:13,pill:true});$('scene').dataset.translation=t.toFixed(3)}
function distribution(averages=false){const values=averages?means():dataset().map(p=>p.epsilon),ref=averages?MU:0,center=averages?MU+s.bias:0,spread=averages?M.se(s.sigma,s.n):s.sigma,lo=Math.min(ref,center-4*spread,...values),hi=Math.max(ref,center+4*spread,...values),mid=(lo+hi)/2,range=Math.max((hi-lo)/2*1.07,.5),k=5/range,h=M.histogram(values,mid-range,mid+range,averages?70:32),peak=Math.max(...h.map(p=>p.density),M.pdf(center,center,spread));w.line([[-5.3,.6,0],[5.3,.6,0]],'#8ca18e',1.3);for(const b of h)if(b.count>0)w.box((b.x-mid)*k,.62,0,9.2/h.length,b.density/peak*3.25,.5,'#9fc2b4');const curve=[];if(s.distribution==='normal'||averages){for(let i=0;i<=160;i++){const x=center-4*spread+8*spread*i/160;curve.push([(x-mid)*k,.65+M.pdf(x,center,spread)/peak*3.25,-.32])}}else if(s.distribution==='uniform'){const r=Math.sqrt(3)*s.sigma,y=.65+1/(2*r)/peak*3.25;curve.push([(-r-mid)*k,.65,-.32],[(-r-mid)*k,y,-.32],[(r-mid)*k,y,-.32],[(r-mid)*k,.65,-.32])}else{for(let i=0;i<=140;i++){const x=-s.sigma+(hi+s.sigma)*i/140;curve.push([(x-mid)*k,.65+Math.exp(-(x/s.sigma+1))/s.sigma/peak*3.25,-.32])}}w.line(curve,'#397e75',2);const rx=(ref-mid)*k;w.line([[rx,.6,-.5],[rx,4.5,-.5]],'#ba9559',1.3,{dash:[5,4]});for(let j=-2;j<=2;j++)w.label([j*2.5,.26,0],(mid+j*range/2).toFixed(1),{size:11});w.label([0,-.22,0],averages?'组均值 x̄ / mg P·L⁻¹':'随机误差 ε = X−μ−b / mg P·L⁻¹',{size:13,pill:true});w.label([0,5.45,0],averages?`180 组，每组 ${s.n} 次 · 长期中心 ${(MU+s.bias).toFixed(1)}`:'800 次随机波动 · 以 0 为长期中心',{size:16,pill:true});w.label([0,4.78,0],averages?(s.distribution==='normal'?'正态母体：均值标准差 σ/√n':'曲线为均值的正态近似，n 小或偏态强时可能不充分'):'直方图为模拟频率密度；曲线为所选概率密度',{size:12,pill:true})}
function field(){w.ground(12,5);for(let block=0;block<3;block++)for(let t=0;t<4;t++){const x=-4.5+t*3,z=-1.5+block*1.4;w.box(x,.04,z,2.5,.15,1.05,['#c4c993','#b3bf88','#a4b67d'][block]);for(let i=0;i<5;i++)MaizeShoot.draw(w,{x:x-.9+i*.45,y:.2,z,height:.65,stage:'vegetative',detail:'low',seed:i+t})}w.label([0,3.2,0],'田间：区组 + 随机化 + 独立重复',{size:18,pill:true});w.label([0,2.35,0],`测量：校正偏差 b=${s.bias.toFixed(1)}；规范操作控制随机波动`,{size:13,pill:true});w.label([0,-.5,2.5],'同一样品测 10 次 ≠ 10 个独立小区',{size:13,pill:true})}
w.draw=()=>{[agriculture,()=>numberLine(),bridge,categories,comparisons,translated,()=>distribution(),()=>distribution(true),field][s.step]();$('scene').dataset.retainedHoles=String(isTarget()?points.slice(0,s.shots).filter(onBoard).length:s.step===4?96:0);$('scene').dataset.holeLayer='above-target';$('scene').dataset.stage=String(s.step)};
function launch(manual=false){if(!isTarget()||flight||s.shots>=s.n)return;flight={index:s.shots,elapsed:0,duration:.44,manual};s.clock=0;panel()}
function motion(){$('motion').textContent=w.paused?'▶ 动画':'Ⅱ 动画';$('motion').setAttribute('aria-pressed',String(!w.paused))}
w.update=dt=>{if(flight&&(!w.paused||flight.manual)){flight.elapsed+=dt;if(flight.elapsed>=flight.duration){const index=flight.index;s.shots=index+1;s.selected=index;impact={index,age:0};flight=null;s.clock=0;panel()}}else if(!w.paused&&isTarget()&&s.shooting&&s.shots<s.n){s.clock+=dt;if(s.clock>=.55)launch()}if(impact&&!w.paused)impact.age+=dt;if(!w.paused)s.translation+=(s.translationTarget-s.translation)*Math.min(1,dt*2);$('scene').dataset.shots=String(s.shots);$('scene').dataset.inFlight=String(!!flight)};
function button(id,text,fn){const b=document.createElement('button');b.id=id;b.textContent=text;b.onclick=()=>{fn();panel()};$('controls').append(b);return b}
function slider(id,label,min,max,step,value,fn){const l=document.createElement('label');l.innerHTML=`${label}<input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}"><output>${value}</output>`;l.querySelector('input').oninput=e=>{const v=Number(e.target.value);l.querySelector('output').textContent=v;fn(v);regen()};$('controls').append(l)}
function chooseDistribution(){const select=document.createElement('select');select.id='e-distribution';select.setAttribute('aria-label','随机误差分布');select.innerHTML=['normal','uniform','skew'].map((v,i)=>`<option value="${v}" ${s.distribution===v?'selected':''}>${['正态','均匀','右偏'][i]}</option>`).join('');select.onchange=()=>{s.distribution=select.value;regen()};$('controls').append(select)}
function controls(){$('controls').replaceChildren();if(s.step===0||s.step===1){button('e-observe','再观测一次',()=>{s.selected=(s.selected+1)%s.n;s.shots=Math.max(s.shots,s.selected+1)});return}if(s.step===4){[['中心近·集中',0,.35],['中心偏·集中',6,.35],['中心近·分散',0,1.8],['中心偏·分散',6,1.8]].forEach(([name,b,sigma],i)=>button('e-case-'+i,name,()=>{s.bias=b;s.sigma=sigma;regen();setStep(3)}));return}if(s.step===8){button('e-calibrate','模拟校正：b 归零',()=>{s.bias=0;regen()});button('e-normalize','规范测定：缩小 σ',()=>{s.sigma=.5;regen()});return}if([3,5,7].includes(s.step))slider('e-bias','系统偏差 b',-8,8,.5,s.bias,v=>s.bias=v);if([3,5,6,7].includes(s.step))slider('e-sigma','随机波动 σ',.2,4,.1,s.sigma,v=>s.sigma=v);if(s.step===7)slider('e-n','每组重复 n',5,200,5,s.n,v=>s.n=v);if(s.step===5||s.step===6)chooseDistribution();if(isTarget()){button('e-fire','射击一次',()=>{s.shooting=false;launch(true);controls()});button('e-shooting',s.shooting?'暂停连射':'继续连射',()=>{s.shooting=!s.shooting;controls()});button('e-replay','重放本组',()=>clearTarget());button('e-repeat','新一组（清靶）',()=>clearTarget(true))}else if(s.step===5){button('e-translate',s.translationTarget?'回到观测值':'逐个减去真值',()=>{s.translationTarget=s.translationTarget?0:1;controls()})}else button('e-repeat','重新模拟',()=>{s.seed++;regen()})}
function stop(){clearInterval(auto);auto=null;$('play').textContent='▶';$('play').setAttribute('aria-pressed','false')}
function setStep(i){s.step=Math.max(0,Math.min(chapters.length-1,i));flight=null;impact=null;s.clock=0;w.extent=s.step===4?13.7:s.step===3&&w.width<700?10:14;w.target=s.step===0?1.6:s.step===8?1.4:s.step===4?3.3:s.step===5?3:2.8;w.focusX=0;w.autoRotate=false;w.camera.yaw=-.12;w.camera.zoom=1;$('rotate').setAttribute('aria-pressed','false');if(s.step===0||s.step===8)w.camera.pitch=.4;else w.camera.pitch=.12;document.querySelectorAll('#steps button').forEach((b,j)=>{b.classList.toggle('active',s.step===j);b.setAttribute('aria-current',s.step===j?'step':'false')});$('progress').textContent=(s.step+1)+' / '+chapters.length;$('prev').disabled=s.step===0;$('next').disabled=s.step===chapters.length-1;controls();panel();document.querySelector('#steps button.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
chapters.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${c[0]}`;b.onclick=()=>{stop();setStep(i)};$('steps').append(b)});
$('prev').onclick=()=>{stop();setStep(s.step-1)};$('next').onclick=()=>{stop();setStep(s.step+1)};$('motion').onclick=()=>{w.paused=!w.paused;motion()};$('rotate').onclick=()=>{w.autoRotate=!w.autoRotate;$('rotate').setAttribute('aria-pressed',String(w.autoRotate))};w.onInteract=()=>$('rotate').setAttribute('aria-pressed','false');$('front').onclick=()=>{w.autoRotate=false;w.camera.yaw=0;w.camera.pitch=.05;w.camera.zoom=1};$('tilt').onclick=()=>{w.camera.pitch=w.camera.pitch>.6?.12:1.0};$('reset').onclick=()=>{stop();Object.assign(s,{bias:3,sigma:1,n:40,seed:73,distribution:'normal',shots:0,selected:0,clock:0,shooting:true,translation:0,translationTarget:0});w.resetView();regen();setStep(0)};$('play').onclick=()=>{if(auto){stop();return}w.paused=false;motion();$('play').textContent='Ⅱ';$('play').setAttribute('aria-pressed','true');auto=setInterval(()=>{if(s.step===chapters.length-1){stop();return}setStep(s.step+1)},14000)};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.errorDiagnostics={get state(){return {...s,inFlight:flight?{...flight}:null}},get summary(){return M.summary(data.map(p=>p.value))},get samples(){return data.map(p=>({...p}))},get records(){return points.slice(0,s.shots).map(p=>({...p}))},get coordinates(){return M.coordinates(dataset(),MU)}};regen();setStep(0);motion();
})();
