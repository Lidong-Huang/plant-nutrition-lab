if(state.step===observeStep){if(state.operation===2)button('c-count','数下一组 100 粒',()=>{state.grainCount=Math.min(1000,state.grainCount+100)});else if(state.operation>=3){const t=button('c-tare',state.grainTared?'已去皮 · 0.00 g':'空盘去皮',tareGrain,state.grainTared);t.disabled=state.grainLoaded;const l=button('c-load','装入 1000 粒',loadGrain);l.disabled=!state.grainTared||state.grainLoaded;const r=button('c-read',state.grainRead?'已读取千粒重':'读取千粒重',readGrain);r.disabled=!state.grainLoaded||!settled();const u=button('c-unload','移开样品',unloadGrain);u.disabled=!state.grainLoaded}return}
if(state.step===resultStep){button('c-return-grain','返回千粒重操作',()=>{setStep(observeStep);setOperation(3)});button('c-csv','下载苗期模拟 CSV ↓',download);return}
for(let t=0;t<3;t++)button('c-treatment-'+t,`${M.treatments[t]} ${type==='soil'?M.soilP[t]+' mg P/kg':M.solutionP[t].toFixed(2)+' mmol P/L'}`,()=>state.treatment=t,state.treatment===t);}
function recipe(){const d=M.dose(type,state.treatment,type==='soil'?5:state.volume),fmt=n=>n.toFixed(1);if(type==='soil')return `<p>5 kg 干土，元素 P ${d.pMg.toFixed(0)} mg / 盆。</p><table><tr><th>本处理</th><th>mg / 盆</th></tr><tr><td>KH₂PO₄</td><td>${fmt(d.kh2po4Mg)}</td></tr><tr><td>KCl 补钾</td><td>${fmt(d.kclMg)}</td></tr></table><p>三个处理总 K 同为 750 mg / 盆；此处 KCl 是全部补钾量，不能再额外施同量钾底肥。N 与其他背景养分另行统一。P 为 0 / 25 / 75 mg/kg，是教学梯度，不是施肥推荐。</p>`;
return `<p>改良半量霍格兰（一），本独立系统初始液量 ${state.volume} L。</p><table><tr><th>组分</th><th>mmol/L</th></tr><tr><td>KNO₃</td><td>2.50</td></tr><tr><td>Ca(NO₃)₂</td><td>2.50</td></tr><tr><td>MgSO₄</td><td>1.00</td></tr><tr><td>KH₂PO₄</td><td>${d.pMmol.toFixed(2)}</td></tr><tr><td>KCl</td><td>${d.kclMmol.toFixed(2)}</td></tr></table><p>本份 KH₂PO₄ ${fmt(d.kh2po4Mg)} mg；KCl ${fmt(d.kclMg)} mg；含元素 P ${fmt(d.pMg)} mg（${d.pMgL.toFixed(2)} mg P/L）。钙盐与镁盐的称量须匹配结晶水。</p><p>各处理相同的微量元素（µmol/L）：B 23、Mn 4.5、Zn 0.38、Cu 0.16、Mo 0.05、Ni 0.05；Fe-EDTA 按 Fe 25。Ni 为现代完整营养背景补充，非教材原表逐项照抄。</p><p>K=3.00，N=7.50，Ca=2.50，Mg=1.00，S=1.00 mmol/L。Cl⁻ 随补钾改变；配平主元素不等于所有阴离子完全相同。具体微量盐和配液顺序见完整文档。</p>`;}
function seedlingResultsHTML(){const means=M.means(type),r=M.records(type),mx=Math.max(...means.map(x=>x.dryG));return '<div class="c-data-label">28 天苗期模拟数据 · 与成熟籽粒称量分开 · 每处理 n=4</div>'+means.map((m,t)=>`<div class="c-bar"><span>${M.treatments[t]}</span><i style="width:${m.dryG/mx*60}%;background:${M.colors[t]}"></i><b>${m.dryG.toFixed(2)} g</b></div>`).join('')+'<table><tr><th>处理</th><th>平均干重 g</th><th>平均吸磷 mg</th></tr>'+means.map((m,t)=>`<tr><td>${M.treatments[t]}</td><td>${m.dryG.toFixed(2)}</td><td>${m.uptakeMg.toFixed(2)}</td></tr>`).join('')+'</table><details><summary>展开 12 个独立单位的模拟记录</summary><table><tr><th>处理 / 重复</th><th>干重 g</th><th>P g/kg</th><th>吸磷 mg</th></tr>'+r.map(x=>`<tr><td>${M.treatments[x.treatment]} / ${x.rep}</td><td>${x.dryG.toFixed(1)}</td><td>${x.pGkg.toFixed(2)}</td><td>${x.uptakeMg.toFixed(2)}</td></tr>`).join('')+'</table></details>';}
function resultHTML(){const r=state.grainRecord;return '<div class="c-data-label">成熟期称量记录 · 教学操作示例</div>'+(r?'<table><tr><th>项目</th><th>记录</th></tr><tr><td>已数粒数</td><td>'+r.count+' 粒</td></tr><tr><td>去皮后净重</td><td>'+r.mass.toFixed(2)+' g</td></tr><tr><td>称量含水率</td><td>'+r.moisture+'%</td></tr><tr><td>原含水率千粒重</td><td>'+r.tkw.toFixed(2)+' g</td></tr><tr><td>折算至 14%</td><td>'+r.correctedTkw.toFixed(2)+' g</td></tr></table>':'<p class="c-data-label">先在上一页完成空盘去皮与装样称量，再生成本次记录。</p>')+'<details><summary>另一终点：28 天苗期吸磷模拟数据</summary>'+seedlingResultsHTML()+'</details>'}
function refreshPanel(){const a=steps[state.step];const ops=CulturePractical.get(type,state.step);$('c-operations').replaceChildren(...(ops||[]).map((text,i)=>{const b=document.createElement('button');b.textContent=text;b.dataset.operation=i;b.setAttribute('aria-pressed',String(i===state.operation));b.onclick=()=>{stop();setOperation(i)};return b}));$('c-operations').hidden=!ops;$('c-eyebrow').textContent=`${String(state.step+1).padStart(2,'0')} / ${a[0]}`;$('c-heading').textContent=a[1];$('c-chain').textContent=a[2];$('c-points').replaceChildren(...a[3].map(t=>{const li=document.createElement('li');li.textContent=t;return li}));const d=M.dose(type,state.treatment,5);$('c-live').textContent=state.step===layoutStep?'每个区组 3 个处理，各 1 个独立单位':state.step===observeStep?`成熟期操作演示 · ${MaizeHarvest.ops[state.operation]}`:type==='sand'&&[3,4,5].includes(state.step)?`${M.phaseNames[state.phase]} · ${M.irrigation(state.phase,state.fraction).pressure?'瓶内加压，止回阀关':'卸压，止回阀开'}`:`当前 ${M.treatments[state.treatment]} · ${type==='soil'?d.pMg+' mg P/盆':d.pMgL.toFixed(2)+' mg P/L'}`;$('c-weigh-adjust').hidden=!(state.step===observeStep&&state.operation>=3&&state.grainLoaded);$('c-grain-moisture').value=state.grainMoisture;$('c-grain-moisture-value').textContent=state.grainMoisture+'%';if(state.step===observeStep){$('c-live').textContent=state.operation===2?'已数 '+state.grainCount+' / 1000 粒':state.operation>=3?(!state.grainTared?'先空盘去皮 → 再装样 → 稳定后读数':!state.grainLoaded?'空盘已归零。点击“装入 1000 粒”或点击秤盘。':!settled()?'样品已装入，等待读数稳定…':!state.grainRead?'读数已稳定，点击“读取千粒重”或天平数显。':'净重 '+state.grainRecord.mass.toFixed(2)+' g；按 14% 含水率折算 '+state.grainRecord.correctedTkw.toFixed(2)+' g。'):'成熟期操作演示 · '+MaizeHarvest.ops[state.operation]}
$('c-recipe-body').innerHTML=recipe();$('c-results').innerHTML=state.step===resultStep?resultHTML():'';document.querySelector('#c-recipe').hidden=state.step===resultStep||state.step===observeStep;$('readout').textContent=state.step===layoutStep?'12 个独立单位':state.step===resultStep?'千粒重记录 · 粒数、净重与含水率':'3 个磷水平 · N、K 等背景配平';$('description').textContent=a[1]+'。'+a[3].join('。');$('scene').setAttribute('aria-label',course.title+'。'+a[1]+'。拖动旋转，滚轮缩放。');HydroLab.panel({state,world:w,setOperation,refresh:()=>{refreshPanel();controls()}});}
function update(){document.querySelectorAll('#steps button').forEach((b,i)=>{b.classList.toggle('active',i===state.step);b.setAttribute('aria-current',i===state.step?'step':'false')});$('progress').textContent=`${state.step+1} / ${steps.length}`;$('prev').disabled=state.step===0;$('next').disabled=state.step===resultStep;controls();refreshPanel();$('scene').dataset.step=state.step;$('scene').dataset.treatment=state.treatment;}
function motion(){$('motion').textContent=w.paused?'▶ 动画':'Ⅱ 动画';$('motion').setAttribute('aria-pressed',String(!w.paused));}
let lastPhase=0,wasSettled=false;w.update=dt=>{if(HydroLab.tick(w,state,dt)){refreshPanel();controls()}if(state.step===observeStep&&state.operation>=3&&settled()!==wasSettled){wasSettled=settled();refreshPanel();controls()}if(state.cycle&&!w.paused){state.cycleClock+=dt;state.phase=Math.floor(state.cycleClock/4)%4;state.fraction=state.cycleClock%4/4;if(state.phase!==lastPhase){lastPhase=state.phase;refreshPanel()}}$('scene').dataset.phase=state.phase;};
function download(){const rows=[['culture','treatment','block_rep','dry_matter_g','P_concentration_g_per_kg','P_uptake_mg','data_type'],...M.records(type).map(x=>[type,'P'+x.treatment,x.rep,x.dryG,x.pGkg,x.uptakeMg.toFixed(3),'synthetic_teaching_example'])],url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=type+'-phosphorus-synthetic.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('prev').onclick=()=>{stop();setStep(state.step-1)};$('next').onclick=()=>{stop();setStep(state.step+1)};$('play').onclick=()=>{if(auto){stop();return}if(state.step===resultStep)setStep(0);auto=true;w.paused=false;motion();$('play').textContent='Ⅱ';$('play').setAttribute('aria-pressed','true');autoTimer=setInterval(()=>{if(HydroLab.autoAdvance(state,setOperation))return;const ops=CulturePractical.get(type,state.step);if(ops&&state.operation<ops.length-1){if(state.step===observeStep&&state.operation===3)state.grainTared=true;setOperation(state.operation+1);return}if(state.step===observeStep&&state.operation===4)readGrain();if(state.step===resultStep){stop();return}setStep(state.step+1)},11000)};$('motion').onclick=()=>{w.paused=!w.paused;motion();if(w.paused)stop()};$('rotate').onclick=()=>{w.autoRotate=!w.autoRotate;$('rotate').setAttribute('aria-pressed',String(w.autoRotate))};w.onInteract=()=>$('rotate').setAttribute('aria-pressed','false');$('front').onclick=()=>{w.autoRotate=false;w.camera.yaw=0;w.camera.pitch=.1;w.camera.zoom=1;$('rotate').setAttribute('aria-pressed','false')};$('tilt').onclick=()=>{w.autoRotate=false;w.camera.pitch=w.camera.pitch>.8?.24:1.1;$('rotate').setAttribute('aria-pressed','false')};$('reset').onclick=()=>{stop();Object.assign(state,{supplementalLight:true,treatment:1,day:28,aeration:true,grainMoisture:14,grainRecord:null,seed:73,layout:M.layout(73)});state.hl=HydroLab.fresh();state.ph=null;HydroLab.init(state);w.resetView();w.paused=false;setStep(0);motion()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='F11 全屏'}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','A','CANVAS','SUMMARY'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){stop();setStep(state.step+1);e.preventDefault()}else if(e.key==='ArrowLeft'){stop();setStep(state.step-1);e.preventDefault()}else if(e.code==='Space'){$('play').click();e.preventDefault()}});
window.cultureDiagnostics={get state(){return JSON.parse(JSON.stringify(state))},get camera(){return {...w.camera}},get time(){return w.time},get paused(){return w.paused},get primitives(){return w.items.length},get hits(){return [...(w.hitRegions||[])]},get water(){return M.irrigation(state.phase,state.fraction)}};setStep(0);motion();
})();
